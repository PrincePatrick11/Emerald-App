<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emerald App</title>

    <!-- The styles of the loading screen. A separate file from `public/` and
         not a <style> in the document — why is explained at the top of
         `public/splash.css`; it is not a matter of taste. As a <link> in the
         <head> it blocks rendering and so is present in the very first
         frame. -->
    <link rel="stylesheet" href="/splash.css" />

    <script>
      /* Two things that have to run before the bundle exists.

         1. Set the saved theme so that the loading screen appears in the
            right colors right away. A deliberate copy of
            `normalizeThemeId()` from `src/themes/theme.ts`: this script
            runs before the bundle and may not import anything.

         2. Set up a last safety net. Normally `AppShell` clears the
            screen, with the timer from `initSplash()` (`lib/splash.ts`) as
            the fallback. Both live in the bundle — if that fails to load or
            an import throws, neither runs. The screen would then stay up
            forever, and because on Windows and Linux it covers the
            app's own window buttons (`decorations: false`), only Alt+F4
            would be left. That is why this one timer lives here, where no
            bundle error can reach it. It removes the screen hard, without
            fading out, and fires later than the regular one so that it does
            not get ahead of it.

         Tauri hashes inline scripts at build time and appends the sha256 to
         `script-src`, so this script runs despite `script-src 'self'`.
         It gets no nonce — the selector for that is
         `script[src^='http']` and matches nothing here. That does not hold
         for `<style>`, see `public/splash.css`. */
      (function () {
        var raw = null;
        try {
          raw = localStorage.getItem('theme-id') || localStorage.getItem('theme');
        } catch (e) {
          /* No access to localStorage — then the default theme it is. */
        }
        document.documentElement.dataset.theme =
          raw === 'emerald-parchment' || raw === 'light' ? 'emerald-parchment' : 'emerald-noctis';

        setTimeout(function () {
          var el = document.getElementById('splash');
          if (el) el.remove();
        }, 15000);
      })();
    </script>
  </head>

  <body>
    <div id="splash" class="splash" data-tauri-drag-region>
      <!-- The strip the window is dragged by. The attribute is not
           inherited — Tauri reads it on the element under the pointer —, so
           it appears a second time here. On the root element of its copy,
           the menu preview removes it again so that a click can close it;
           this strip stays and carries dragging through both cases. Why is
           explained at `.splash-drag` in `public/splash.css`. -->
      <div class="splash-drag" data-tauri-drag-region></div>
      <svg class="splash-gem" viewBox="-128 -128 512 512" aria-hidden="true">
        <defs>
          <!-- The colors of all stops are in `splash.css`, not here:
               `var()` in an SVG presentation attribute is not substituted by
               every engine. A multi-stop falloff instead of two stops,
               because two-stop interpolation over such a long, flat ramp
               shows visible rings in 8 bit. -->
          <radialGradient id="splash-glow" gradientUnits="userSpaceOnUse" cx="128" cy="122" r="241">
            <stop offset="0%"   stop-opacity="0.22" />
            <stop offset="30%"  stop-opacity="0.15" />
            <stop offset="55%"  stop-opacity="0.07" />
            <stop offset="78%"  stop-opacity="0.02" />
            <stop offset="100%" stop-opacity="0" />
          </radialGradient>
          <!-- The breath: bright light from the middle of the stone. -->
          <radialGradient id="splash-breath-grad" gradientUnits="userSpaceOnUse"
                          cx="128" cy="122" r="86">
            <stop offset="0%"   stop-opacity="0.20" />
            <stop offset="55%"  stop-opacity="0.08" />
            <stop offset="100%" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="splash-table" x1="0" y1="0" x2="0" y2="1">
            <stop class="splash-table-top"    offset="0%" />
            <stop class="splash-table-bottom" offset="100%" />
          </linearGradient>
          <linearGradient id="splash-band" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-opacity="0" />
            <stop offset="50%"  stop-opacity="1" />
            <stop offset="100%" stop-opacity="0" />
          </linearGradient>
          <clipPath id="splash-clip">
            <polygon points="74,77 97,54 159,54 182,77 182,167 159,190 97,190 74,167" />
          </clipPath>
        </defs>

        <!-- The glow. r=241 lies entirely within the viewBox — see the
             comment on `.splash-gem` in `splash.css`. -->
        <circle class="splash-halo" cx="128" cy="122" r="241" fill="url(#splash-glow)" />

        <!-- The emerald: crown of eight facets, table, step cut -->
        <g clip-path="url(#splash-clip)">
          <polygon class="splash-facet" points="74,77 97,54 105,71 91,89" />
          <polygon class="splash-facet" points="97,54 159,54 151,71 105,71" />
          <polygon class="splash-facet" points="159,54 182,77 165,89 151,71" />
          <polygon class="splash-facet" points="182,77 182,167 165,155 165,89" />
          <polygon class="splash-facet" points="182,167 159,190 151,173 165,155" />
          <polygon class="splash-facet" points="159,190 97,190 105,173 151,173" />
          <polygon class="splash-facet" points="97,190 74,167 91,155 105,173" />
          <polygon class="splash-facet" points="74,167 74,77 91,89 91,155" />

          <polygon points="91,89 105,71 151,71 165,89 165,155 151,173 105,173 91,155"
                   fill="url(#splash-table)" opacity="0.9" />

          <circle class="splash-breath" cx="128" cy="122" r="86"
                  fill="url(#splash-breath-grad)" />

          <!-- The cut edges as lines of their own. Without them they would
               only arise where two facet fills meet — and such a seam is
               antialiased independently from both sides, so it comes out
               soft. -->
          <path class="splash-cut" fill="none"
                d="M74,77 L91,89 M97,54 L105,71 M159,54 L151,71 M182,77 L165,89
                   M182,167 L165,155 M159,190 L151,173 M97,190 L105,173 M74,167 L91,155
                   M91,89 L105,71 L151,71 L165,89 L165,155 L151,173 L105,173 L91,155 Z" />

          <polygon class="splash-step" fill="none" stroke-width="1" opacity="0.28"
                   points="102,90 111,78 145,78 154,90 154,154 145,166 111,166 102,154" />

          <!-- The tilt sits on this group and not on the rectangle: the
               CSS animation on `transform` would replace a `transform`
               attribute on the rectangle itself, and the band would run
               upright. -->
          <g transform="rotate(18 128 122)">
            <rect class="splash-sheen" x="44" y="38" width="33" height="174"
                  fill="url(#splash-band)" opacity="0.5" />
          </g>
        </g>

        <polygon class="splash-outline" fill="none" stroke-width="2"
                 stroke-linejoin="round" opacity="0.95"
                 points="74,77 97,54 159,54 182,77 182,167 159,190 97,190 74,167" />

        <!-- Sparks: four-pointed stars, drawn as four inward-curved
             quarters around the center. -->
        <path class="splash-spark"
              d="M51,41 Q51,51 61,51 Q51,51 51,61 Q51,51 41,51 Q51,51 51,41 Z" />
        <path class="splash-spark"
              d="M207,158 Q207,166 215,166 Q207,166 207,174 Q207,166 199,166 Q207,166 207,158 Z" />
        <path class="splash-spark"
              d="M128,212 Q128,221 137,221 Q128,221 128,230 Q128,221 119,221 Q128,221 128,212 Z" />
      </svg>
      <div class="splash-word">Emerald App</div>
      <div class="splash-rail"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
