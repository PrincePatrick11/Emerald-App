name: Manual Desktop Builds

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS bundles
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows bundles
        required: true
        type: boolean
        default: true
      build_linux:
        description: Build Linux bundles
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-desktop-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-apple-silicon:
    if: ${{ inputs.build_macos }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS Apple Silicon bundle
        env:
          # Seit `createUpdaterArtifacts` in der Config steht, bricht der
          # Bundler ohne privaten Schluessel ab: "A public key has been found,
          # but no private key." Die Secrets gehoeren deshalb auch hierher,
          # nicht nur ins Release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emerald-macos-apple-silicon
          # Nur die Installer. Seit `createUpdaterArtifacts` an ist,
          # liegen im Bundle-Verzeichnis auch das Updater-Bundle und die
          # Signaturen — und Workflow-Artefakte kann auf einem oeffentlichen
          # Repository jeder angemeldete Nutzer herunterladen. Signierte
          # Bundles beliebiger Zweige gehoeren dort nicht hin.
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows bundle
        env:
          # Seit `createUpdaterArtifacts` in der Config steht, bricht der
          # Bundler ohne privaten Schluessel ab: "A public key has been found,
          # but no private key." Die Secrets gehoeren deshalb auch hierher,
          # nicht nur ins Release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emerald-windows
          # Nur die Installer. Seit `createUpdaterArtifacts` an ist,
          # liegen im Bundle-Verzeichnis auch das Updater-Bundle und die
          # Signaturen — und Workflow-Artefakte kann auf einem oeffentlichen
          # Repository jeder angemeldete Nutzer herunterladen. Signierte
          # Bundles beliebiger Zweige gehoeren dort nicht hin.
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

  build-ubuntu:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Ubuntu bundle
        env:
          # Seit `createUpdaterArtifacts` in der Config steht, bricht der
          # Bundler ohne privaten Schluessel ab: "A public key has been found,
          # but no private key." Die Secrets gehoeren deshalb auch hierher,
          # nicht nur ins Release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles deb,appimage

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emerald-ubuntu
          # Nur die Installer. Seit `createUpdaterArtifacts` an ist,
          # liegen im Bundle-Verzeichnis auch das Updater-Bundle und die
          # Signaturen — und Workflow-Artefakte kann auf einem oeffentlichen
          # Repository jeder angemeldete Nutzer herunterladen. Signierte
          # Bundles beliebiger Zweige gehoeren dort nicht hin.
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
