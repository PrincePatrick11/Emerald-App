name: Rust tests

# A file of its own rather than a line in `ci.yml`: `cargo test` covers a small,
# changing set of things, listed in Documentation/build.md under Known gaps.
#
# What the matrix brings and what it does not: the difference is important
# enough for lines of its own, because it is otherwise remembered wrongly:
#
# It brings: that the tests actually *run* rather than only compile (this is
# the first time the Rust side is also linked on a push), and the three
# path parsers and `rename` semantics checked against each other. The test
# around `..` in a stored path, for instance, says something different on
# Windows than on Linux.
#
# It does *not* bring the case the first version of the takeover would have
# failed on. That lies not in the code but in Tauri's startup order
# (on Linux the target directory already exists because the first window
# creates it as a webview profile), and `vault.rs` has not a single
# `cfg(target_os)`. The test simulates foreign files in the target; that
# they really land there before our code runs can only be shown by a real
# start. That is a separate item in `Documentation/build.md` under
# "Cutting a release" and is **not** replaced by this file.

on:
  push:
    branches: [main, 'version/**']
    # Only when the Rust side changes. The run costs the same
    # setup as `ci.yml` (toolchain, Linux packages, frontend build, because
    # `tauri-build` aborts without `dist/`), and the price is only worth
    # paying when there is something new to check.
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-tests.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-tests.yml'

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A red Linux run should not kill the macOS run; the tests touch
      # paths and `rename`, which behave differently per platform, so
      # each of the three results is interesting on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - run: npm ci

      # As in `ci.yml`: `tauri-build` reads `frontendDist: "../dist"` and
      # aborts if the directory is missing. A test run cannot get around that
      # either, although it touches nothing of the frontend.
      - name: Build frontend
        run: npm run build

      # `--lib` on purpose: there are no integration tests under `src-tauri/tests/`
      # and no doc tests. If some are added, the flag has to go.
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
