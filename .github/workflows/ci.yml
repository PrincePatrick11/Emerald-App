name: CI

on:
  push:
    branches: [main, 'version/**']
  pull_request:

permissions:
  contents: read

# Quick follow-up pushes should replace the previous run, not run alongside it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, Schema, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same check as locally. `build` is tsc + vite, so the typecheck is included.
      - name: Schema, i18n, blocks, docs, typecheck and build
        run: npm run check

  rust:
    # The real purpose of this file: `src-tauri/src/pdf_export/` has three
    # implementations, one behind each `cfg(target_os)`. Whoever develops on
    # Windows never compiles `macos.rs` and `linux.rs`, so errors in them
    # would only surface in the release build, once the tag already exists.
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A red Linux run should not kill the macOS run; both results
      # are of interest.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - run: npm ci

      # `tauri-build` reads `frontendDist: "../dist"` and aborts if the
      # directory is missing, so `cargo check` needs the frontend even though
      # it compiles none of it.
      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      # The dev bridge is behind a feature no build has by default, so the
      # check above never sees it.
      - name: Check Rust with the dev bridge
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --features devbridge

      # Without the bridge: its platform-gated code has known dead-code warnings
      # outside macOS.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  mcp:
    name: MCP tests
    # Edge, the engine of WebView2. Chrome on the Ubuntu image starts no page.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements-dev.txt

      # conftest.py skips the browser tests when it finds no browser, so a
      # missing browser would not fail this job.
      - run: python -m pytest
