name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Pushing the same tag twice would otherwise let two runs race for the same
# release assets. No `cancel-in-progress`: a running release build is not
# cancelled, the second run waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version appears in three places and must match character for character:
      # the UI shows it from package.json, the bundle file name comes from Cargo.toml.
      # Runs before the release is created: all build jobs depend on this one via
      # `needs`, so a failure costs not a single build minute.
      - name: Verify the tag matches all three version sites
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, pathlib, re, sys

          tag = sys.argv[1].removeprefix('v')
          cargo = pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          sites = {
              'package.json':
                  json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version'],
              'src-tauri/tauri.conf.json':
                  json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version'],
              'src-tauri/Cargo.toml':
                  re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1),
          }

          bad = [f for f, v in sites.items() if v != tag]
          for f, v in sites.items():
              print(f'{"MISMATCH" if f in bad else "ok      "}  {f}: {v}')
          if bad:
              print(f'::error::Tag is {tag}, but {", ".join(bad)} disagree.')
              sys.exit(1)
          print(f'All three version sites agree with the tag: {tag}')
          PY

      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VERSION]" '
            $0 ~ /^## \[/ {
              if (started) exit
              if (index($0, ver) == 1) started = 1
            }
            started { print }
          ' CHANGELOG.md > release-notes.md
          echo "--- extracted release notes ---"
          cat release-notes.md

      - name: Create or update release with notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      # The manifest job runs in its own container and would not have the file
      # otherwise; it ends up as `notes` in latest.json.
      - name: Keep the notes for the update manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-macos-apple-silicon:
    needs: prepare-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Apple code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping code signing."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "ci-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci-keychain" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "ci-keychain" build.keychain
          rm certificate.p12
          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Clear stale bundle output
        shell: bash
        run: rm -rf "src-tauri/target/aarch64-apple-darwin/release/bundle"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Collect the updater signature
        run: >
          node scripts/updater-fragment.mjs
          --platform darwin-aarch64
          --dir src-tauri/target/aarch64-apple-darwin/release/bundle/macos

      - uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-darwin-aarch64
          path: updater-fragments/*.json

      # The `.app.tar.gz` is what the updater downloads; the .dmg stays for
      # the first installation by hand.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Clear stale bundle output
        shell: bash
        run: rm -rf "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

      # OpenSSL (under SQLCipher) builds without an assembler if NASM is missing, so
      # without AES-NI: slower and not constant-time.
      - uses: ilammy/setup-nasm@v1

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      # NSIS, not MSI: the updater can handle both, but the manifest holds exactly
      # one address per platform, and the NSIS installer is the one the
      # website serves.
      - name: Collect the updater signature
        run: >
          node scripts/updater-fragment.mjs
          --platform windows-x86_64
          --dir src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis

      - uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-windows-x86_64
          path: updater-fragments/*.json

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  build-ubuntu:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Clear stale bundle output
        shell: bash
        run: rm -rf "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles deb,appimage

      # Only the AppImage: the updater cannot replace a `.deb`, so Linux
      # appears in the manifest with the AppImage only.
      - name: Collect the updater signature
        run: >
          node scripts/updater-fragment.mjs
          --platform linux-x86_64
          --dir src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage

      - uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-linux-x86_64
          path: updater-fragments/*.json

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  # Last, with `needs` on all three builds: the manifest is the switch that
  # makes the new version visible to installed apps. If it existed earlier,
  # the app would offer an update whose file is still being built.
  publish-manifest:
    needs: [build-macos-apple-silicon, build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the platform signatures
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: updater-fragments
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # The addresses come from the release itself: GitHub rewrites special characters in
      # asset names, so a self-built URL would lead nowhere.
      - name: Read the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[] | {name, url}]' > assets.json

      - name: Build latest.json
        run: >
          node scripts/updater-manifest.mjs
          --tag "$GITHUB_REF_NAME"
          --assets assets.json
          --fragments updater-fragments
          --notes release-notes.md
          --out latest.json

      - name: Upload the manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
