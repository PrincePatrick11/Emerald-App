name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Derselbe Tag zweimal geschoben liesse sonst zwei Laeufe um dieselben
# Release-Assets rennen. Kein `cancel-in-progress`: einen laufenden Release-Build
# bricht man nicht ab, der zweite wartet.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Die Version steht an drei Stellen und muss zeichengleich sein — die UI
      # zeigt sie aus package.json, der Bundle-Dateiname kommt aus Cargo.toml.
      # Laeuft vor dem Release-Anlegen: alle Build-Jobs haengen per `needs` hier
      # dran, ein Fehlschlag kostet also keine einzige Buildminute.
      - name: Verify the tag matches all three version sites
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, pathlib, re, sys

          tag = sys.argv[1].removeprefix('v')
          cargo = pathlib.Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          sites = {
              'package.json':
                  json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version'],
              'src-tauri/tauri.conf.json':
                  json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version'],
              'src-tauri/Cargo.toml':
                  re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1),
          }

          bad = [f for f, v in sites.items() if v != tag]
          for f, v in sites.items():
              print(f'{"MISMATCH" if f in bad else "ok      "}  {f}: {v}')
          if bad:
              print(f'::error::Tag is {tag}, but {", ".join(bad)} disagree.')
              sys.exit(1)
          print(f'All three version sites agree with the tag: {tag}')
          PY

      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VERSION]" '
            $0 ~ /^## \[/ {
              if (started) exit
              if (index($0, ver) == 1) started = 1
            }
            started { print }
          ' CHANGELOG.md > release-notes.md
          echo "--- extracted release notes ---"
          cat release-notes.md

      - name: Create or update release with notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      # Der Manifest-Job laeuft in einem eigenen Container und haette die Datei
      # sonst nicht — sie wandert als `notes` in die latest.json.
      - name: Keep the notes for the update manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-macos-apple-silicon:
    needs: prepare-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Apple code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured, skipping code signing."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "ci-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci-keychain" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "ci-keychain" build.keychain
          rm certificate.p12
          echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Collect the updater signature
        run: >
          node scripts/updater-fragment.mjs
          --platform darwin-aarch64
          --dir src-tauri/target/aarch64-apple-darwin/release/bundle/macos

      - uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-darwin-aarch64
          path: updater-fragments/*.json

      # Das `.app.tar.gz` ist das, was der Updater laedt — die .dmg bleibt fuer
      # die Erstinstallation von Hand.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      # NSIS, nicht MSI: der Updater kann beide, aber im Manifest steht pro
      # Plattform genau eine Adresse — und der NSIS-Installer ist der, den die
      # Webseite ausliefert.
      - name: Collect the updater signature
        run: >
          node scripts/updater-fragment.mjs
          --platform windows-x86_64
          --dir src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis

      - uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-windows-x86_64
          path: updater-fragments/*.json

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  build-ubuntu:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles deb,appimage

      # Nur das AppImage: ein `.deb` kann der Updater nicht ersetzen, deshalb
      # steht Linux im Manifest ausschliesslich mit dem AppImage.
      - name: Collect the updater signature
        run: >
          node scripts/updater-fragment.mjs
          --platform linux-x86_64
          --dir src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage

      - uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-linux-x86_64
          path: updater-fragments/*.json

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  # Zuletzt, mit `needs` auf allen drei Builds: das Manifest ist der Schalter,
  # der die neue Version fuer installierte Apps sichtbar macht. Waere es frueher
  # da, boete die App ein Update an, dessen Datei noch gebaut wird.
  publish-manifest:
    needs: [build-macos-apple-silicon, build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the platform signatures
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: updater-fragments
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Die Adressen kommen vom Release selbst: GitHub schreibt Sonderzeichen in
      # Asset-Namen um, eine selbst gebaute URL liefe ins Leere.
      - name: Read the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[] | {name, url}]' > assets.json

      - name: Build latest.json
        run: >
          node scripts/updater-manifest.mjs
          --tag "$GITHUB_REF_NAME"
          --assets assets.json
          --fragments updater-fragments
          --notes release-notes.md
          --out latest.json

      - name: Upload the manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
